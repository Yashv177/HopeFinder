<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HopeFinder - Login / Signup</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0f14 0%, #1a1a2e 50%, #16213e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }
    
    /* Animated Background */
    .bg-shapes {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .bg-shapes span {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      animation: float 20s infinite ease-in-out;
      opacity: 0.4;
    }
    .bg-shapes span:nth-child(1) { width: 400px; height: 400px; background: #6366f1; left: -100px; top: -100px; animation-delay: 0s; }
    .bg-shapes span:nth-child(2) { width: 300px; height: 300px; background: #8b5cf6; right: -50px; bottom: -50px; animation-delay: 5s; }
    .bg-shapes span:nth-child(3) { width: 200px; height: 200px; background: #a855f7; left: 50%; top: 50%; animation-delay: 10s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
    }

    .container { position: relative; z-index: 1; width: 100%; max-width: 440px; }

    /* Main Card */
    .auth-card {
      background: rgba(26, 26, 36, 0.95);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      backdrop-filter: blur(20px);
    }

    /* Header */
    .auth-header {
      padding: 35px 35px 25px;
      text-align: center;
      position: relative;
    }
    .auth-header::after {
      content: ''; position: absolute; bottom: 0; left: 35px; right: 35px;
      height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }
    .logo-circle {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 10px 40px rgba(99, 102, 241, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .logo-circle i { font-size: 32px; color: white; }
    .auth-title { font-size: 1.6rem; font-weight: 700; color: #fff; margin-bottom: 5px; }
    .auth-subtitle { font-size: 0.9rem; color: rgba(255,255,255,0.5); }

    /* Tabs */
    .tabs-wrap { padding: 0 35px; margin-bottom: 25px; }
    .tab-buttons {
      display: flex; background: rgba(255,255,255,0.03); border-radius: 14px;
      padding: 5px; border: 1px solid rgba(255,255,255,0.05); position: relative;
    }
    .tab-btn {
      flex: 1; padding: 12px; border: none; background: transparent;
      color: rgba(255,255,255,0.5); font-family: inherit; font-size: 0.9rem;
      font-weight: 500; cursor: pointer; border-radius: 10px; transition: all 0.3s ease;
      z-index: 1;
    }
    .tab-btn.active { color: #fff; }
    .tab-slider {
      position: absolute; top: 5px; left: 5px;
      width: calc(50% - 5px); height: calc(100% - 10px);
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px; transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    /* Forms */
    .forms-area { padding: 0 35px 35px; }
    .form-panel { display: none; animation: slideUp 0.4s ease; }
    .form-panel.active { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .input-wrap { margin-bottom: 18px; }
    .input-label { display: block; font-size: 0.8rem; font-weight: 500; color: rgba(255,255,255,0.7); margin-bottom: 7px; }
    .input-box { position: relative; }
    .input-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.3); font-size: 1.1rem; transition: 0.3s; }
    .input-box input, .input-box select {
      width: 100%; padding: 14px 15px 14px 48px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; color: #fff; font-family: inherit; font-size: 0.95rem;
      transition: 0.3s;
    }
    .input-box input:focus, .input-box select:focus {
      outline: none; border-color: rgba(99, 102, 241, 0.5);
      background: rgba(99, 102, 241, 0.05);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }
    .input-box input:focus + i, .input-box select:focus + i { color: #6366f1; }
    .input-box input::placeholder { color: rgba(255,255,255,0.25); }
    .input-box select { appearance: none; cursor: pointer; padding-right: 40px; }
    .input-box select option { background: #1a1a24; }
    .password-toggle {
      position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
      color: rgba(255,255,255,0.4); cursor: pointer; transition: 0.3s; background: none; border: none; padding: 0;
    }
    .password-toggle:hover { color: rgba(255,255,255,0.7); }

    /* Captcha */
    .captcha-area { margin-bottom: 20px; }
    .captcha-row { display: flex; gap: 12px; align-items: center; }
    .captcha-display {
      flex: 1; background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.15));
      border: 1px solid rgba(99,102,241,0.25); border-radius: 12px;
      padding: 13px 20px; font-family: 'Courier New', monospace;
      font-size: 1.5rem; font-weight: 700; color: #a5b4fc;
      letter-spacing: 5px; text-align: center; user-select: none;
    }
    .refresh-captcha {
      width: 50px; height: 50px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
      color: rgba(255,255,255,0.5); cursor: pointer; transition: 0.3s;
      display: flex; align-items: center; justify-content: center;
    }
    .refresh-captcha:hover { background: rgba(99,102,241,0.1); border-color: rgba(99,102,241,0.3); color: #a5b4fc; }
    .captcha-input { margin-top: 12px; }
    .captcha-input input {
      width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
      color: #fff; font-family: inherit; font-size: 0.95rem; transition: 0.3s;
    }
    .captcha-input input:focus { outline: none; border-color: rgba(99,102,241,0.5); background: rgba(99,102,241,0.05); }

    /* Submit */
    .submit-btn {
      width: 100%; padding: 15px; background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none; border-radius: 14px; color: white; font-family: inherit;
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); position: relative; overflow: hidden;
    }
    .submit-btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: 0.5s;
    }
    .submit-btn:hover::before { left: 100%; }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.4); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn.loading { pointer-events: none; }
    .submit-btn.loading .btn-text { opacity: 0; }
    .submit-btn.loading::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 20px; height: 20px; margin: -10px 0 0 -10px;
      border: 2px solid transparent; border-top-color: white; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Switch Link */
    .switch-area {
      text-align: center; margin-top: 25px; padding-top: 22px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .switch-area p { font-size: 0.9rem; color: rgba(255,255,255,0.5); margin: 0; }
    .switch-area a {
      color: #a5b4fc; text-decoration: none; font-weight: 500;
      position: relative; transition: 0.3s;
    }
    .switch-area a::after {
      content: ''; position: absolute; bottom: -2px; left: 0; width: 100%;
      height: 1px; background: linear-gradient(90deg, #6366f1, #8b5cf6);
      transform: scaleX(0); transform-origin: right; transition: 0.3s;
    }
    .switch-area a:hover::after { transform: scaleX(1); transform-origin: left; }
    .switch-area a:hover { color: #c7d2fe; }

    /* Footer */
    .auth-footer {
      padding: 18px 35px; background: rgba(255,255,255,0.02);
      border-top: 1px solid rgba(255,255,255,0.03); text-align: center;
    }
    .auth-footer p { font-size: 0.75rem; color: rgba(255,255,255,0.25); margin: 0; }

    /* Animations */
    .shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* Validation styles */
    .input-box.error input, .input-box.error select { border-color: #ef4444; }
    .error-msg { color: #ef4444; font-size: 0.75rem; margin-top: 5px; display: none; }
    .input-box.error .error-msg { display: block; }

    /* Success animation */
    .success-check {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 80px; height: 80px; background: rgba(34, 197, 94, 0.1);
      border-radius: 50%; display: none; align-items: center; justify-content: center;
    }
    .success-check.show { display: flex; animation: popIn 0.3s ease; }
    @keyframes popIn { from { transform: translate(-50%, -50%) scale(0); } to { transform: translate(-50%, -50%) scale(1); } }
    .success-check i { font-size: 40px; color: #22c55e; }
  </style>
</head>
<body>
  <div class="bg-shapes">
    <span></span><span></span><span></span>
  </div>

  <div class="container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-circle"><i class="bi bi-search-heart"></i></div>
        <h1 class="auth-title">HopeFinder</h1>
        <p class="auth-subtitle">Find lost people, reunite families</p>
      </div>

      <div class="tabs-wrap">
        <div class="tab-buttons">
          <div class="tab-slider" id="tabSlider"></div>
          <button class="tab-btn active" onclick="switchTab('login')">Login</button>
          <button class="tab-btn" onclick="switchTab('signup')">Signup</button>
        </div>
      </div>

      <div class="forms-area">
        <!-- Login Form -->
        <div class="form-panel active" id="loginPanel">
          <form action="php/login.php" method="POST" enctype="multipart/form-data" id="loginForm" onsubmit="return handleLogin(event)">
            <div class="input-wrap">
              <label class="input-label">Select Role</label>
              <div class="input-box">
                <select name="role" required>
<option value="User">Public/User</option>
                  <option value="Police">Police</option>
                  <option value="Admin">Admin</option>
                </select>
                <i class="bi bi-person-badge"></i>
              </div>
            </div>

            <div class="input-wrap">
              <label class="input-label">Email Address</label>
              <div class="input-box">
                <input type="email" name="email" id="loginEmail" placeholder="name@example.com" required>
                <i class="bi bi-envelope"></i>
              </div>
            </div>

            <div class="input-wrap">
              <label class="input-label">Password</label>
              <div class="input-box">
                <input type="password" name="password" id="loginPass" placeholder="Enter your password" required>
                <i class="bi bi-lock"></i>
                <button type="button" class="password-toggle" onclick="togglePassword('loginPass', this)">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="captcha-area">
              <div class="captcha-row">
                <div class="captcha-display" id="captchaLogin">K7M2P</div>
                <button type="button" class="refresh-captcha" onclick="refreshCaptcha('login')">
                  <i class="bi bi-arrow-clockwise"></i>
                </button>
              </div>
              <div class="captcha-input">
                <input type="text" id="captchaInputLogin" placeholder="Enter captcha" required>
              </div>
            </div>

            <button type="submit" class="submit-btn">
              <span class="btn-text">Sign In</span>
            </button>

            <div class="switch-area">
              <p>Don't have an account? <a href="#" onclick="switchTab('signup'); return false;">Create one</a></p>
            </div>
          </form>
        </div>

        <!-- Signup Form -->
        <div class="form-panel" id="signupPanel">
          <form action="./php/signup.php" method="POST" id="signupForm">
            <div class="input-wrap">
              <label class="input-label">Full Name</label>
              <div class="input-box">
                <input type="text" name="fullname" id="signupName" placeholder="John Doe" required>
                <i class="bi bi-person"></i>
              </div>
            </div>

            <div class="input-wrap">
              <label class="input-label">Email Address</label>
              <div class="input-box">
                <input type="email" name="email" id="signupEmail" placeholder="name@example.com" required>
                <i class="bi bi-envelope"></i>
              </div>
            </div>

            <div class="input-wrap">
              <label class="input-label">Phone Number</label>
              <div class="input-box">
                <input type="tel" name="mobile_number" id="signupPhone" placeholder="+91 98765 43210" required>
                <i class="bi bi-phone"></i>
              </div>
            </div>

            <div class="input-wrap">
              <label class="input-label">Password</label>
              <div class="input-box">
                <input type="password" name="password" id="signupPass" placeholder="Create a password" required>
                <i class="bi bi-lock"></i>
                <button type="button" class="password-toggle" onclick="togglePassword('signupPass', this)">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="captcha-area">
              <div class="captcha-row">
                <div class="captcha-display" id="captchaSignup">R3T8M</div>
                <button type="button" class="refresh-captcha" onclick="refreshCaptcha('signup')">
                  <i class="bi bi-arrow-clockwise"></i>
                </button>
              </div>
              <div class="captcha-input">
                <input type="text" id="captchaInputSignup" placeholder="Enter captcha" required>
              </div>
            </div>

            <button type="button" class="submit-btn" onclick="handleSignup(event)">
              <span class="btn-text">Create Account</span>
            </button>

            <div class="switch-area">
              <p>Already have an account? <a href="#" onclick="switchTab('login'); return false;">Sign in</a></p>
            </div>
          </form>
        </div>
      </div>

      <div class="auth-footer">
        <p>Secure Authentication • Protected by HopeFinder</p>
      </div>
    </div>
  </div>

  <script>
    let captchaLogin = generateCaptcha();
    let captchaSignup = generateCaptcha();
    document.getElementById('captchaLogin').textContent = captchaLogin;
    document.getElementById('captchaSignup').textContent = captchaSignup;

    function generateCaptcha(length = 5) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

function refreshCaptcha(type, skipEvent) {
      let btn;
      if (!skipEvent && event && event.currentTarget) {
        btn = event.currentTarget;
        btn.style.transform = 'rotate(180deg)';
        setTimeout(() => btn.style.transform = 'rotate(0deg)', 300);
      }

      if (type === 'login') {
        captchaLogin = generateCaptcha();
        document.getElementById('captchaLogin').textContent = captchaLogin;
        document.getElementById('captchaInputLogin').value = '';
      } else {
        captchaSignup = generateCaptcha();
        document.getElementById('captchaSignup').textContent = captchaSignup;
        document.getElementById('captchaInputSignup').value = '';
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
      
      const slider = document.getElementById('tabSlider');
      slider.style.left = tab === 'login' ? '5px' : 'calc(50% - 5px)';
      
      document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(tab + 'Panel').classList.add('active');
    }

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    function handleLogin(e) {
      e.preventDefault();

      const input = document.getElementById('captchaInputLogin').value;
      if (input !== captchaLogin) {
        const captchaRow = document.querySelector('#loginPanel .captcha-row');
        captchaRow.classList.add('shake');
        setTimeout(() => captchaRow.classList.remove('shake'), 400);
        refreshCaptcha('login');  
        return false;
      }

      const form = document.getElementById('loginForm');
      const formData = new FormData(form);

      document.querySelector('#loginForm .submit-btn').classList.add('loading');

fetch('php/login.php', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        document.querySelector('#loginForm .submit-btn').classList.remove('loading');

        if (data.success) {
          // Redirect to dashboard
          window.location.href = data.redirect;
        } else {
Swal.fire({
  icon: 'error',
  title: 'Login Failed',
  text: data.message || 'Please try again'
});
          if (data.locked) {
            // If locked, disable form
            document.getElementById('loginEmail').disabled = true;
            document.getElementById('loginPass').disabled = true;
          }
          refreshCaptcha('login');
        }
      })
      .catch(error => {
        document.querySelector('#loginForm .submit-btn').classList.remove('loading');
        console.error('Login error:', error);
        alert('Login failed! Please try again.');
      });

      return false;
    }

async function handleSignup(e) {
      e.preventDefault();
      
      const input = document.getElementById('captchaInputSignup').value.toUpperCase();
      if (input !== captchaSignup) {
        const captchaRow = document.querySelector('#signupPanel .captcha-row');
        captchaRow.classList.add('shake');
        setTimeout(() => captchaRow.classList.remove('shake'), 400);
        refreshCaptcha('signup');
        Swal.fire({
          icon: "error",
          title: "Invalid Captcha",
          text: "Please check captcha and try again"
        });
        return;
      }

      const btn = document.querySelector('#signupForm .submit-btn');
      btn.classList.add('loading');

      const formData = new FormData();
      formData.append('fullname', document.getElementById('signupName').value.trim());
      formData.append('email', document.getElementById('signupEmail').value.trim());
      formData.append('mobile_number', document.getElementById('signupPhone').value.trim());
      formData.append('password', document.getElementById('signupPass').value);

      try {
        const response = await fetch('./php/signup.php', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        btn.classList.remove('loading');

        if (data.success) {
          Swal.fire({
            icon: 'success',
            title: 'Success!',
            text: data.message || 'Account created successfully!',
            timer: 2000,
            showConfirmButton: false
          }).then(() => {
            // Clear form and switch to login
            document.getElementById('signupForm').reset();
            switchTab('login');
          });
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: data.message || 'Signup failed. Try again.'
          });
        }
      } catch (error) {
        btn.classList.remove('loading');
        console.error('Signup error:', error);
        Swal.fire({
          icon: 'error',
          title: 'Network Error',
          text: 'Please check your connection and try again.'
        });
      }
    }
  </script>
</body>
</html>
