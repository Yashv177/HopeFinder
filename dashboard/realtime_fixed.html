<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HopeFinder - Real-Time AI Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        #videoContainer { position: relative; max-width: 640px; }
        #videoStream { width: 640px; height: 480px; object-fit: cover; }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4><i class="bi bi-camera-video"></i> Live CCTV <span id="statusBadge" class="badge bg-secondary">Stopped</span></h4>
                    </div>
                    <div class="card-body">
                        <div id="videoContainer">
                            <img id="videoStream" src="http://localhost:5002/video_feed" style="display:none;" alt="Live Stream">
                            <div class="text-center p-5" id="noStream">
                                <i class="bi bi-camera-video-off display-1 text-muted"></i>
                                <p class="text-muted">Click START to begin live stream</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Controls</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-success w-100 mb-3" onclick="startStream()">
                            <i class="bi bi-play-fill"></i> START CAMERA
                        </button>
                        <button class="btn btn-danger w-100" onclick="stopStream()" disabled>
                            <i class="bi bi-stop-fill"></i> STOP
                        </button>
                        <hr>
                        <small class="text-muted">
                            Server: http://localhost:5002<br>
                            Test stream: <a href="http://localhost:5002/video_feed" target="_blank">Open</a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let streamActive = false;

        function startStream() {
            const video = document.getElementById('videoStream');
            const noStream = document.getElementById('noStream');
            
            // Call server start
            fetch('http://localhost:5002/start')
                .then(() => {
                    video.style.display = 'block';
                    noStream.style.display = 'none';
                    document.getElementById('statusBadge').className = 'badge bg-success';
                    document.getElementById('statusBadge').textContent = 'LIVE';
                    streamActive = true;
                    document.querySelector('.btn-danger').disabled = false;
                    document.querySelector('.btn-success').disabled = true;
                })
                .catch(e => alert('Server error - start server first'));
        }

        function stopStream() {
            fetch('http://localhost:5002/stop')
                .then(() => {
                    document.getElementById('videoStream').style.display = 'none';
                    document.getElementById('noStream').style.display = 'block';
                    document.getElementById('statusBadge').className = 'badge bg-secondary';
                    document.getElementById('statusBadge').textContent = 'Stopped';
                    streamActive = false;
                    document.querySelector('.btn-success').disabled = false;
                    document.querySelector('.btn-danger').disabled = true;
                });
        }

        // Auto-reconnect
        document.getElementById('videoStream').addEventListener('error', function() {
            if (streamActive) {
                setTimeout(startStream, 2000);
            }
        });
    </script>
</body>
</html>
