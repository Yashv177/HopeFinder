<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Match System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* CAMERA */
        #video-stream {
            width: 100%;
            height: 420px;
            object-fit: cover;
            border-radius: 12px;
        }

        #stream-status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #94a3b8;
        }

        /* PERSON LIST */
        .person-list {
            max-height: 180px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .person-list label {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
        }

        .person-list label:hover {
            background: #475569;
        }

        /* 🔥 TABLE FIX */
        .table img {
            border-radius: 6px;
        }

        .table td {
            vertical-align: middle;
            text-align: center;
        }

        .table th {
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- TOAST -->
    <div id="toast-container" class="position-fixed top-0 end-0 p-3"></div>

    <!-- SOUND -->
    <audio id="beep-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

    <div class="container mt-4">

        <h2 class="mb-4">
            <i class="bi bi-robot text-info"></i> AI Face Matching System
        </h2>

        <div class="row g-4">

            <!-- CAMERA -->
            <div class="col-lg-8">
                <div class="card p-3 position-relative">

                    <h5>Live CCTV Feed</h5>

                    <img id="video-stream">
                    <div id="stream-status">Camera Offline</div>

                </div>
            </div>

            <!-- CONTROL -->
            <div class="col-lg-4">
                <div class="card p-4">

                    <button id="start-ai" class="btn btn-success w-100 mb-2">
                        <i class="bi bi-play-fill"></i> Start AI
                    </button>

                    <button id="stop-ai" class="btn btn-danger w-100 mb-3" disabled>
                        <i class="bi bi-stop-fill"></i> Stop AI
                    </button>

                    <div>Status: <span id="status">Offline</span></div>

                    <h6 class="mt-3">
                        <i class="bi bi-people"></i> Missing Persons
                    </h6>

                    <div id="missing-list" class="person-list"></div>

                    <button id="select-all" class="btn btn-outline-light btn-sm w-100 mt-2">
                        Select All
                    </button>

                </div>
            </div>

        </div>

        <!-- DETECTIONS -->
        <div class="card p-4 mt-4">

            <h5>
                <i class="bi bi-bell text-warning"></i>
                Detections <span id="detections-count">0</span>
            </h5>

            <div class="table-responsive">
                <table class="table table-dark table-striped table-hover text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Image</th>
                            <th>Report ID</th>
                            <th>Location</th>
                            <th>Date & Time</th>
                        </tr>
                    </thead>

                    <tbody id="detections-list">
                        <tr>
                            <td colspan="5" class="text-muted">No detections yet</td>
                        </tr>
                        <td>
                            <a href="https://www.google.com/maps?q=${det.latitude},${det.longitude}" target="_blank">

                            </a>
                        </td>
                    </tbody>

                </table>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
