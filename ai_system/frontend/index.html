<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HopeFinder AI Detection Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 sidebar">
                <div class="logo mb-4">
                    <i class="bi bi-shield-check text-primary fs-1"></i>
                    <h3>HopeFinder AI</h3>
                </div>
                
                <!-- Missing Persons -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5><i class="bi bi-people"></i> Missing Persons</h5>
                    </div>
                    <div class="card-body">
                        <div id="missing-list" class="list-group list-group-flush"></div>
                        <button id="select-all" class="btn btn-sm btn-outline-secondary w-100 mt-2">Select All</button>
                    </div>
                </div>
                
                <!-- Controls -->
                <div class="card">
                    <div class="card-header">
                        <h6><i class="bi bi-play-circle"></i> AI Controls</h6>
                    </div>
                    <div class="card-body">
                        <button id="start-ai" class="btn btn-success w-100 mb-2" disabled>
                            <i class="bi bi-play"></i> Start AI
                        </button>
                        <button id="stop-ai" class="btn btn-danger w-100" disabled>
                            <i class="bi bi-stop"></i> Stop AI
                        </button>
                        <div class="mt-2">
                            <small>Server: <span id="status">Offline</span></small>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-9">
                <!-- Live Stream -->
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between">
                        <h5><i class="bi bi-camera-video"></i> Live CCTV Stream</h5>
                        <span id="fps-counter" class="badge bg-secondary">0 FPS</span>
                    </div>
                    <div class="card-body text-center">
                        <img id="video-stream" src="" class="img-fluid rounded shadow" alt="Live Stream" style="max-height: 500px; display:none;">
                        <div id="stream-status" class="alert alert-warning mt-2">
                            <i class="bi bi-exclamation-triangle"></i> Stream offline
                        </div>
                    </div>
                </div>
                
                <!-- Recent Detections -->
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-bell"></i> Recent Detections <span id="detections-count" class="badge bg-primary">0</span></h5>
                    </div>
                    <div class="card-body">
                        <div id="detections-list" class="row"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

    <!-- Toast notifications & sound -->
    <div id="toast-container" class="fixed top-4 right-4 z-[9999] space-y-2 max-w-sm"></div>
    <audio id="beep-sound" preload="auto">
      <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcDj+a8linkAzPoSuUWMnYqG..." type="audio/wav">
    </audio>
  </body>
</html>
