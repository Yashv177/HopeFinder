<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification System Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">HopeFinder</a>
            
            <div class="navbar-nav ms-auto">
                <div class="nav-item dropdown">
                    <a class="nav-link position-relative p-2" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-bell fs-4"></i>
                        <span class="notification-badge position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">
                            0
                        </span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" style="width: 400px; max-height: 500px; overflow-y: auto;" id="notificationsDropdown">
                        <!-- Notifications load here -->
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <div class="row">
            <div class="col-12">
                <h1>Real-time Notification Demo</h1>
                <p class="lead">Live notifications with sound alerts, priority badges, auto-refresh</p>
                
                <!-- Test Panel -->
                <div class="card mt-4">
                    <div class="card-header">
                        <h5>Test Notifications <i class="bi bi-play-circle"></i></h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <button class="btn btn-danger w-100" onclick="sendTestNotification('high')">
                                    🚨 High Priority (Police)
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-warning w-100" onclick="sendTestNotification('medium')">
                                    ⚠️ Medium Priority (User)
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-success w-100" onclick="sendTestNotification('low')">
                                    ✅ Low Priority (Admin)
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-primary w-100" onclick="markAllRead()">
                                    Mark All Read
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JavaScript/notifications.js"></script>
    
    <script>
        // Demo functions - simulate logged in user
        sessionStorage.setItem('user_id', '1');
        sessionStorage.setItem('role', 'police');
        
        async function sendTestNotification(priority) {
            const messages = {
                high: '🚨 New missing report #R' + Math.floor(Math.random()*1000) + ' in your area',
                medium: '✅ Report #R456 approved by admin',
                low: 'ℹ️ New user registered in system'
            };
            
            await fetch('api/send_notification.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `target=police&message=${encodeURIComponent(messages[priority])}&priority=${priority}&type=${priority}_alert&link=#`
            });
        }
        
        async function markAllRead() {
            await fetch('api/notifications.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'action=mark_all_read'
            });
        }
    </script>
</body>
</html>
